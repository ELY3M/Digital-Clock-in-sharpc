name: .NET Cross-Compile Windows EXE

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

env:
  SOLUTION_FILE_PATH: .
  BUILD_CONFIGURATION: Release

permissions: write-all

jobs:
  build:
    # Changed from windows-latest to ubuntu-latest
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Setup the .NET SDK (runs natively on Linux)
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Match your project's .NET version

    # Restores and publishes the Windows .exe directly from Linux
    - name: Publish Windows EXE
      run: |
        dotnet publish ${{ env.SOLUTION_FILE_PATH }} \
          -c ${{ env.BUILD_CONFIGURATION }} \
          -r win-x64 \
          --self-contained true \
          -o ./publish_windows

    - name: Show Github infos
      run: echo "Workspace path ${{ github.workspace }} - runner.temp ${{ runner.temp }}"     

    # Linux has 'zip' built-in, replacing the Windows 7z syntax
    - name: Zipping up Release folder
      run: |
        cd ./publish_windows
        zip -r ../release.zip .

    - name: Upload Release
      uses: softprops/action-gh-release@v2
      with:
        draft: false
        prerelease: false    
        tag_name: ${{ github.run_number }}
        body: ${{ github.event.head_commit.message }}
        files: release.zip
      env:
        GITHUB_TOKEN: ${{ github.token }}
